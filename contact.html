<h1>Contact</h1>
<p>Send a message using the form below.</p>
<form action="#" method="post">
<label>Name <input type="text" name="name" required></label>
<label>Email <input type="email" name="email" required></label>
<label>Topic <select name="topic">
    <option>General</option>
    <option>Support</option>
    <option>Feedback</option>
</select>
</label>
<fieldset>
    <legend>Preferred reply</legend>
<label><input type="radio" name="reply" value="email" checked> Email</label>
<label><input type="radio" name="reply" value="phone"> Phone</label>
</fieldset>
<label><span><input type="checkbox" name="news"> Subscribe to updates</span>
</label>
<label>Message <textarea name="message" rows="5" required></textarea>
</label>
<button type="submit">Send message</button>
</form>
